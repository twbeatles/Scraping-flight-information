name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      run_selector_probe:
        description: "Run live DOM selector probe after search smoke"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  interpark-live:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m playwright install chromium

      - name: Run Interpark live search smoke
        run: >
          python scripts/live_smoke_search.py
          --max-results 5
          --fail-on-cap
          --max-domestic-pages 30
          --max-international-pages 50
          ${{ inputs.run_selector_probe == 'true' && '--selector-probe' || '' }}